<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142b23">
  <meta name="description" content="Planejamento compartilhado do Baja UMC, de agosto de 2026 a dezembro de 2028.">
  <title>Planejamento Baja UMC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #0b1d30;
      --muted: #607184;
      --line: #d7e1ea;
      --paper: #f3f7fa;
      --card: #ffffff;
      --forest: #07477f;
      --forest-2: #092f58;
      --lime: #77c5ec;
      --sand: #e9f2f8;
      --danger: #b42318;
      --shadow: 0 18px 45px rgba(6, 35, 64, .14);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 3% 3%, rgba(70, 153, 204, .18), transparent 23rem),
        linear-gradient(180deg, #f4f8fb 0, var(--paper) 28rem);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button, a, select, input[type="date"], input[type="color"], input[type="file"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: var(--forest-2); }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .shell { width: min(1460px, 100%); margin: 0 auto; padding: 20px clamp(14px, 3vw, 42px) calc(56px + env(safe-area-inset-bottom, 0px)); }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 92px;
      color: white;
      background: linear-gradient(120deg, #061a2e 0%, #063e71 58%, #0c5894 100%);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 28px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .topbar::after {
      content: "";
      position: absolute;
      width: 310px;
      height: 310px;
      right: 8%;
      top: -252px;
      border: 35px solid rgba(119, 197, 236, .2);
      border-radius: 50%;
      pointer-events: none;
    }
    .brand { display: flex; align-items: center; min-width: 0; gap: 15px; position: relative; z-index: 1; }
    .brand-logos { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .logo-slot {
      height: 64px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 7px 18px rgba(0, 0, 0, .15);
    }
    .logo-slot.umc { width: 112px; }
    .logo-slot.baja { width: 66px; border-radius: 50%; }
    .logo-slot img { display: block; width: 100%; height: 100%; object-fit: contain; padding: 7px; }
    .logo-slot.baja img { padding: 2px; }
    .eyebrow { margin: 0 0 2px; color: #9cd8f4; text-transform: uppercase; letter-spacing: .16em; font-size: 11px; font-weight: 850; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 33px); line-height: 1.05; letter-spacing: -.035em; }
    .subtitle { margin: 5px 0 0; color: #c8d5cf; font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: 9px; position: relative; z-index: 1; }

    .btn {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 780;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: #061a2e; background: #8bd3f3; }
    .btn-secondary { color: white; background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .18); }
    .btn-light { color: var(--forest); background: white; border-color: var(--line); }
    .btn-danger { color: var(--danger); background: #fff; border-color: #f1cbc7; }
    .btn-small { min-height: 36px; padding: 7px 11px; border-radius: 10px; font-size: 13px; }
    .icon-btn { width: 42px; padding: 0; font-size: 20px; }

    .config-warning {
      margin: 18px 0 0;
      padding: 15px 17px;
      border: 1px solid #eadf96;
      border-radius: 15px;
      color: #634d00;
      background: #fff9d8;
      font-size: 14px;
      line-height: 1.5;
    }

    .access-gate {
      width: min(760px, 100%);
      margin: 48px auto 0;
      padding: clamp(28px, 6vw, 54px);
      text-align: center;
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .access-gate-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      color: white;
      background: var(--forest);
      font-size: 27px;
    }
    .access-gate h2 { margin: 0; font-size: clamp(27px, 5vw, 40px); letter-spacing: -.04em; }
    .access-gate p { max-width: 570px; margin: 13px auto 22px; color: var(--muted); line-height: 1.65; }
    .access-gate-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; }

    .summary-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      gap: 14px;
      margin: 18px 0;
    }
    .summary-card {
      min-width: 0;
      background: rgba(255, 255, 255, .9);
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 15px 17px;
      box-shadow: 0 9px 22px rgba(8, 52, 91, .06);
    }
    .summary-label { margin: 0 0 7px; color: var(--muted); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    .summary-value { margin: 0; font-size: 16px; font-weight: 830; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-note { margin: 4px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .section-switch {
      display: flex;
      width: fit-content;
      max-width: 100%;
      gap: 5px;
      margin: 0 0 14px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 9px 22px rgba(8, 52, 91, .06);
    }
    .section-switch button { min-height: 40px; border: 0; border-radius: 11px; padding: 8px 16px; color: var(--muted); background: transparent; font-weight: 800; }
    .section-switch button.active { color: white; background: var(--forest); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 34px rgba(8, 52, 91, .08); }
    .calendar-panel { overflow: hidden; }
    .calendar-toolbar {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 17px;
      border-bottom: 1px solid var(--line);
    }
    .month-nav { display: flex; align-items: center; gap: 8px; }
    .month-title { margin: 0; text-align: center; text-transform: capitalize; font-size: clamp(19px, 3vw, 27px); letter-spacing: -.025em; }
    .view-switch { display: flex; padding: 3px; border-radius: 11px; background: #edf1ee; }
    .view-switch button { min-height: 34px; border: 0; border-radius: 8px; padding: 5px 10px; color: var(--muted); background: transparent; font-weight: 750; }
    .view-switch button.active { color: var(--forest); background: white; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
    .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { background: #f4f6f3; border-bottom: 1px solid var(--line); }
    .weekday { padding: 10px 5px; color: var(--muted); text-align: center; text-transform: uppercase; font-size: 10px; font-weight: 850; letter-spacing: .08em; }
    .day {
      min-width: 0;
      min-height: 116px;
      padding: 8px;
      background: #fff;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .day:nth-child(7n) { border-right: 0; }
    .day.outside { background: #fafbf9; color: #a0aaa6; }
    .day.today { background: linear-gradient(145deg, #fbfdea, #fff); box-shadow: inset 0 0 0 2px rgba(200, 222, 69, .7); }
    .day-head { display: flex; align-items: center; justify-content: space-between; min-height: 24px; margin-bottom: 5px; }
    .day-number { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; font-weight: 830; }
    .today .day-number { color: white; background: #07477f; }
    .day-add { border: 0; color: var(--forest); background: transparent; font-weight: 900; opacity: 0; padding: 2px 4px; }
    /* A inclusÃ£o de atividades fica concentrada no botÃ£o â€œ+ Nova atividadeâ€. */
    .day-add { display: none !important; }
    .day:hover .day-add, .day-add:focus { opacity: 1; }
    .event-chip {
      width: 100%;
      border: 0;
      border-left: 4px solid var(--event-color, var(--forest));
      border-radius: 7px;
      padding: 5px 6px;
      margin: 0 0 4px;
      color: var(--ink);
      background: #eef4f8;
      background: color-mix(in srgb, var(--event-color, var(--forest)) 11%, white);
      text-align: left;
      font-size: 10px;
      font-weight: 750;
      line-height: 1.22;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .more-events { color: var(--muted); font-size: 10px; font-weight: 800; padding-left: 7px; }

    .agenda-list { padding: 12px 16px 20px; }
    .agenda-day { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .agenda-date { color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; }
    .agenda-date strong { display: block; color: var(--forest); font-size: 24px; line-height: 1; }
    .agenda-event {
      width: 100%;
      display: grid;
      grid-template-columns: 7px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 12px;
      padding: 10px 11px;
      margin-bottom: 7px;
      color: var(--ink);
      background: #f5f7f4;
      text-align: left;
    }
    .agenda-event-dot { width: 7px; height: 100%; min-height: 36px; background: var(--event-color); border-radius: 6px; }
    .agenda-event strong { display: block; margin-bottom: 3px; }
    .agenda-event small { color: var(--muted); }

    .side { display: grid; gap: 14px; }
    .filter-panel, .legend-panel { padding: 17px; }
    .panel-title { margin: 0 0 14px; font-size: 16px; }
    .field { margin-bottom: 13px; }
    .field:last-child { margin-bottom: 0; }
    label, .field-label { display: block; margin: 0 0 6px; color: #4f6059; font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .065em; }
    input, select, textarea {
      width: 100%;
      min-height: 45px;
      border: 1px solid #d4ddd8;
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--ink);
      background: white;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #2375ad; box-shadow: 0 0 0 3px rgba(35, 117, 173, .14); }
    textarea { min-height: 116px; resize: vertical; line-height: 1.5; }
    .search { padding-left: 36px; }
    .search-wrap { position: relative; }
    .search-wrap::before { content: "âŒ•"; position: absolute; left: 13px; top: 7px; color: var(--muted); font-size: 23px; z-index: 1; }
    .legend-list { display: grid; gap: 9px; }
    .legend-item { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 13px; }
    .legend-color { width: 11px; height: 11px; flex: 0 0 auto; border-radius: 4px; background: var(--legend-color); }
    .legend-item span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .legend-item small { margin-left: auto; color: var(--muted); }
    .empty { padding: 38px 20px; color: var(--muted); text-align: center; }

    .assignee-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; max-height: 210px; overflow-y: auto; padding: 8px; border: 1px solid #d4ddd8; border-radius: 12px; background: #fbfdfe; }
    .assignee-option { display: flex; min-width: 0; align-items: center; gap: 8px; margin: 0; padding: 8px; border-radius: 9px; color: var(--ink); font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .assignee-option:hover { background: #eaf3f8; }
    .assignee-option input { width: 18px; min-height: 18px; flex: 0 0 auto; margin: 0; padding: 0; }
    .assignee-option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .notes-panel { overflow: hidden; }
    .notes-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px; border-bottom: 1px solid var(--line); }
    .notes-toolbar h2 { margin: 0; font-size: clamp(19px, 3vw, 27px); letter-spacing: -.025em; }
    .notes-toolbar p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .notes-table-wrap { width: 100%; overflow-x: auto; }
    .notes-table { width: 100%; min-width: 1040px; border-collapse: collapse; }
    .notes-table th { padding: 12px; color: var(--muted); background: #f4f7f9; text-align: left; text-transform: uppercase; font-size: 10px; letter-spacing: .07em; }
    .notes-table td { max-width: 260px; padding: 13px 12px; border-top: 1px solid var(--line); vertical-align: top; color: #31485a; font-size: 13px; line-height: 1.45; }
    .notes-table td:last-child { white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-title { max-width: 230px; border: 0; padding: 0; color: var(--forest); background: transparent; text-align: left; font-weight: 820; }
    .note-date { display: block; white-space: nowrap; }
    .note-state { display: inline-flex; margin-top: 5px; border-radius: 999px; padding: 3px 7px; color: #38576c; background: #e9f1f6; font-size: 10px; font-weight: 820; }
    .note-state.overdue { color: #9b2f2f; background: #fde9e8; }
    .priority-low { color: #4e6d5b; }
    .priority-medium { color: #8a641b; }
    .priority-critical { color: #a83232; font-weight: 850; }

    .status { position: fixed; left: 50%; bottom: 18px; z-index: 100; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; max-width: min(90vw, 540px); padding: 11px 16px; border-radius: 12px; color: white; background: #092f58; box-shadow: var(--shadow); font-weight: 750; transition: .2s ease; }
    .status.show { transform: translate(-50%, 0); opacity: 1; }
    .status.error { background: var(--danger); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(7, 23, 17, .6);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
    }
    .modal-card { width: min(680px, 100%); max-height: calc(100vh - 32px); max-height: min(91dvh, 900px); overflow: auto; -webkit-overflow-scrolling: touch; background: white; border-radius: 24px; box-shadow: var(--shadow); }
    .modal-card.large { width: min(830px, 100%); }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 19px 20px 15px; background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 22px; }
    .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .close { flex: 0 0 auto; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: white; font-size: 22px; }
    .modal-body { padding: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; padding: 15px 20px 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .helper { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .badge { display: inline-flex; align-items: center; min-height: 26px; border-radius: 999px; padding: 4px 9px; color: var(--forest); background: #e9f0d2; font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .05em; }

    .detail-title { margin: 10px 0 4px; font-size: clamp(24px, 4vw, 35px); line-height: 1.1; letter-spacing: -.03em; }
    .detail-group { margin: 0; color: var(--muted); font-weight: 750; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin: 20px 0; }
    .detail-box { padding: 12px; border-radius: 13px; background: #f3f6f3; }
    .detail-box span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .07em; }
    .detail-box strong { font-size: 13px; }
    .rich-text { overflow-wrap: anywhere; white-space: normal; line-height: 1.62; }
    .rich-text a { font-weight: 760; }
    .attachments { display: grid; gap: 8px; margin-top: 15px; }
    .attachment { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
    .attachment-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 750; }

    .pending-files { display: grid; gap: 7px; margin-top: 9px; }
    .pending-file { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 9px 10px; background: #f2f5f2; border-radius: 10px; font-size: 13px; }
    .pending-file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-file { border: 0; color: var(--danger); background: transparent; font-weight: 850; }

    .group-list { display: grid; gap: 9px; margin: 14px 0; }
    .group-row { display: grid; grid-template-columns: 13px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 11px 12px; border: 1px solid var(--line); border-radius: 13px; }
    .group-dot { width: 13px; height: 42px; border-radius: 7px; background: var(--group-color); }
    .group-row strong, .group-row small { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-row small { color: var(--muted); margin-top: 2px; }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr 1fr; }
      .day { min-height: 100px; }
    }
    @media (max-width: 680px) {
      .shell { padding: 8px 8px 40px; }
      .topbar { border-radius: 20px; padding: 13px; grid-template-columns: 1fr; }
      .brand { align-items: flex-start; }
      .brand-logos { gap: 5px; }
      .logo-slot { height: 50px; border-radius: 11px; }
      .logo-slot.umc { width: 84px; }
      .logo-slot.baja { width: 50px; border-radius: 50%; }
      .subtitle { display: none; }
      .top-actions { justify-content: stretch; }
      .top-actions .btn { flex: 1; }
      .access-gate { margin-top: 22px; border-radius: 20px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .summary-card { padding: 11px; border-radius: 13px; }
      .summary-grid .summary-card:first-child { grid-column: 1 / -1; }
      .summary-value { font-size: 14px; }
      .workspace { gap: 10px; }
      .calendar-toolbar { grid-template-columns: 1fr auto; padding: 11px; }
      .month-nav { grid-column: 1 / -1; justify-content: space-between; }
      .month-title { order: 2; }
      .month-nav button:first-child { order: 1; }
      .month-nav button:last-child { order: 3; }
      #todayBtn { justify-self: start; }
      .view-switch { justify-self: end; }
      .weekdays { display: grid; }
      .weekday { padding: 8px 1px; font-size: 9px; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 5px; }
      .day, .day.outside { display: block; min-height: 66px; padding: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: white; }
      .day:nth-child(7n) { border-right: 0; }
      .day.today { background: linear-gradient(145deg, #f7fbe8, #fff); box-shadow: inset 0 0 0 2px rgba(119, 197, 236, .75); }
      .day-head { align-items: center; justify-content: center; margin: 0 0 3px; }
      .day-number { width: 27px; height: 27px; font-size: 12px; }
      .day-add { display: none; }
      .event-stack { min-width: 0; }
      .event-chip { padding: 4px 3px; margin-bottom: 3px; border-left-width: 3px; font-size: 9px; }
      .more-events { font-size: 9px; padding-left: 3px; }
      .side { grid-template-columns: 1fr; }
      .legend-panel { order: 2; }
      .form-grid, .detail-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: auto; }
      .modal { align-items: end; padding: 0; }
      .modal-card, .modal-card.large { width: 100%; max-height: 94vh; max-height: 94dvh; padding-bottom: env(safe-area-inset-bottom, 0px); border-radius: 22px 22px 0 0; }
      .modal-head, .modal-body { padding-left: 16px; padding-right: 16px; }
      .agenda-day { grid-template-columns: 61px minmax(0, 1fr); }
      .agenda-event { grid-template-columns: 6px minmax(0, 1fr); }
      .agenda-event > small { grid-column: 2; }
      .section-switch { width: 100%; }
      .section-switch button { flex: 1; padding-right: 8px; padding-left: 8px; }
      .assignee-options { grid-template-columns: 1fr; }
      .notes-toolbar { align-items: stretch; flex-direction: column; }
      .notes-table-wrap { overflow: visible; padding: 8px; }
      .notes-table, .notes-table tbody, .notes-table tr, .notes-table td { display: block; width: 100%; min-width: 0; }
      .notes-table thead { display: none; }
      .notes-table tr { margin-bottom: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: white; }
      .notes-table td { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 9px; max-width: none; padding: 9px 11px; border-top: 1px solid #edf1f4; }
      .notes-table td:first-child { border-top: 0; }
      .notes-table td::before { content: attr(data-label); color: var(--muted); text-transform: uppercase; font-size: 9px; font-weight: 850; letter-spacing: .06em; }
      .note-title { max-width: none; }
    }
  </style>
